<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cio Budget Planner</title>
<style>
:root{
  --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eef1ec; --border:#dfe4dc;
  --text:#1d2a20; --muted:#667066; --accent:#2f6b3f; --accent-soft:#e3efe5; --accent-text:#ffffff;
  --blue:#2c5d8a; --blue-soft:#e4edf6;
  --good:#1f8a5b; --bad:#c0392b; --bad-soft:#fbe7e5; --warn:#b7791f; --warn-soft:#fdf3e1;
  --shadow:0 1px 2px rgba(20,40,25,.06),0 2px 8px rgba(20,40,25,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121612; --surface:#1a201b; --surface-2:#222a23; --border:#2e382f;
    --text:#e5ebe5; --muted:#99a59a; --accent:#6fbf86; --accent-soft:#1f3326; --accent-text:#0f1a12;
    --blue:#79a9d6; --blue-soft:#1d2b3a; --good:#4cc08b; --bad:#ec7a6d; --bad-soft:#3b1f1c; --warn:#e0a64b; --warn-soft:#3a2f1c;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121612; --surface:#1a201b; --surface-2:#222a23; --border:#2e382f;
  --text:#e5ebe5; --muted:#99a59a; --accent:#6fbf86; --accent-soft:#1f3326; --accent-text:#0f1a12;
  --blue:#79a9d6; --blue-soft:#1d2b3a; --good:#4cc08b; --bad:#ec7a6d; --bad-soft:#3b1f1c; --warn:#e0a64b; --warn-soft:#3a2f1c;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:flex;min-height:100vh}
.side{width:224px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;z-index:11}
.logo{font-weight:700;font-size:16px;padding:0 10px 14px;cursor:pointer}
.logo small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.tabs{display:flex;flex-direction:column;gap:3px}
.tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:14px}
.tab .ic{width:18px;height:18px}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tab .ct{margin-left:auto;font-size:11px;font-weight:700;background:var(--bad);color:#fff;border-radius:999px;padding:0 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:12px 4px 0;border-top:1px solid var(--border)}
.side-foot .btn{justify-content:center}
.content{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 28px;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
main{max-width:1180px;padding:22px 28px 70px}
/* countdown */
.countdown{display:flex;align-items:center;gap:12px;flex:1 1 340px;min-width:0}
.cd-num{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.cd-num b{font-size:24px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.cd-num span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.cd-side{flex:1;min-width:140px}
.cd-side .bar{height:7px;margin:3px 0}
.cd-text{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-text b{color:var(--text)}
.cd-icon{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0}
.cd-icon .ic{width:18px;height:18px}
/* currency converter */
.fx{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 8px 6px 10px;margin-left:auto;max-width:470px}
.fx input{width:74px;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:var(--bg);text-align:right;font-weight:600}
.fx select{padding:5px 4px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-weight:600}
.fx-out{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;min-width:92px;text-align:right;color:var(--accent)}
.fx-live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--good);text-transform:uppercase;letter-spacing:.05em}
.fx-live .dot{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 2s infinite}
.fx-live.off{color:var(--muted)} .fx-live.off .dot{background:var(--muted);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,138,91,.5)}70%{box-shadow:0 0 0 6px rgba(31,138,91,0)}100%{box-shadow:0 0 0 0 rgba(31,138,91,0)}}
.fx-meta{flex-basis:100%;font-size:11px;line-height:1.35;color:var(--muted);text-align:right}
.fx-out.flash{animation:flash .6s}
@keyframes flash{0%{opacity:.3}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.fx-live .dot{animation:none}.fx-out.flash{animation:none}}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:22px;margin:0 auto 0 0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.icon-btn{border:0;background:none;padding:5px;border-radius:6px;cursor:pointer;color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn.del:hover{color:var(--bad)}
.icon-btn svg{width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
.pad{padding:16px}
.months{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.mchip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.mchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.mchip.now:not(.on){border-color:var(--accent);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{padding:13px 16px}
.stat .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stat .num{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .sub{color:var(--muted);font-size:12px}
.ic{display:inline-block;width:16px;height:16px;flex-shrink:0;vertical-align:-3px;background-color:currentColor;-webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat}
.ic.lg{width:18px;height:18px}
.ic-zap{--src:url(icons/zap.svg)}
.ic-folder-open{--src:url(icons/folder-open.svg)}
.ic-save{--src:url(icons/save.svg)}
.ic-house{--src:url(icons/house.svg)}
.ic-arrow-left{--src:url(icons/arrow-left.svg)}
.ic-chevron-left{--src:url(icons/chevron-left.svg)}
.ic-chevron-right{--src:url(icons/chevron-right.svg)}
.ic-pencil{--src:url(icons/pencil.svg)}
.ic-trash{--src:url(icons/trash.svg)}
.ic-party-popper{--src:url(icons/party-popper.svg)}
.ic-circle-check{--src:url(icons/circle-check.svg)}
.ic-triangle-alert{--src:url(icons/triangle-alert.svg)}
.ic-plus{--src:url(icons/plus.svg)}
.ic-calendar-days{--src:url(icons/calendar-days.svg)}
.ic-calendar-range{--src:url(icons/calendar-range.svg)}
.ic-receipt{--src:url(icons/receipt.svg)}
.ic-wallet{--src:url(icons/wallet.svg)}
.ic-trending-down{--src:url(icons/trending-down.svg)}
.ic-arrow-right{--src:url(icons/arrow-right.svg)}
.ic-layout-dashboard{--src:url(icons/layout-dashboard.svg)}
.ic-badge-check{--src:url(icons/badge-check.svg)}
.ic-arrow-left-right{--src:url(icons/arrow-left-right.svg)}
.ic-refresh-cw{--src:url(icons/refresh-cw.svg)}
.ic-external-link{--src:url(icons/external-link.svg)}
.ic-hourglass{--src:url(icons/hourglass.svg)}
.ic-trophy{--src:url(icons/trophy.svg)}
.ic-clock{--src:url(icons/clock.svg)}
.ic-circle-alert{--src:url(icons/circle-alert.svg)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.backbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ysel{padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-weight:700;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi .num{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0}
.kpi .sub{color:var(--muted);font-size:12px}
.kpi.hi{border-color:var(--accent)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.legend{display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px}
.lg-inc,.b-inc{background:var(--blue)} .lg-exp,.b-exp{background:var(--accent)}
.chart{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:220px;align-items:end;margin-top:10px}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;border:0;background:none;cursor:pointer;padding:4px 0;border-radius:8px;gap:3px}
.chart .col:hover,.chart .col.cur{background:var(--surface-2)}
.chart .bars{display:flex;align-items:flex-end;gap:2px;height:150px;width:100%;justify-content:center}
.chart .bars span{width:38%;max-width:14px;border-radius:3px 3px 0 0;min-height:2px;transition:height .5s}
.chart .b-inc{opacity:.55}
.c-left{font-size:11px;font-weight:700;color:var(--good);font-variant-numeric:tabular-nums}
.c-m{font-size:11px;color:var(--muted)}
.mini-tbl th,.mini-tbl td{padding:7px 8px}
.hbar{margin-bottom:8px}
.hb-top{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.hbar .bar{height:6px;margin-top:3px}
.link{cursor:pointer;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.tag.late{background:var(--bad-soft);color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--accent-soft);color:var(--accent)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.cut-head h2 .ic{color:var(--warn)}
@media (max-width:980px){.dash-grid{grid-template-columns:1fr}}
@media (max-width:560px){.chart{gap:2px}.c-left{font-size:9px}}

.summary{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:8px 14px;padding:18px 20px;margin-bottom:18px}
.summary .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.summary .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.summary .sub{color:var(--muted);font-size:12px}
.summary .op{font-size:24px;color:var(--muted)}
.sum-tbl{grid-column:1/-1;margin-top:10px}
.sum-tbl th,.sum-tbl td{padding:7px 10px}

.quick{padding:16px 18px;margin-bottom:16px;border-color:var(--accent)}
.q-title{font-weight:700;margin-bottom:10px}
#qa{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#qa input{padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}
#qa input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.q-name{flex:1 1 200px}
.q-amt-wrap{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;background:var(--bg);padding-left:10px;font-weight:700}
.q-amt-wrap .q-amt{border:0!important;width:120px;font-size:17px;font-weight:700;background:transparent!important}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 11px;cursor:pointer;font-size:13px;border-left:1px solid var(--border)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:var(--accent-text);font-weight:600}
.q-months{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.q-months input{width:64px}
.q-months[hidden]{display:none}
.q-impact{margin-top:10px;padding:9px 12px;border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.q-impact.ok{background:var(--accent-soft);color:var(--accent)}
.q-impact.meh{background:var(--warn-soft);color:var(--warn)}
.q-impact.bad{background:var(--bad-soft);color:var(--bad)}
.q-impact small{opacity:.85}
.debt{padding:14px 18px;margin-bottom:16px}
.debt-top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.debt .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.debt-pct{font-size:26px;font-weight:700;color:var(--accent)}
.debt-meta{color:var(--muted);font-size:13px;margin-left:auto}
.debt-meta b{color:var(--text)}
.big-bar{height:12px}
.bar span{transition:width .5s ease}
.amt.editable{cursor:text;border-radius:6px;padding:2px 6px;margin:-2px -6px}
.amt.editable:hover{background:var(--accent-soft);color:var(--accent)}
.inline-amt{width:100px;padding:4px 6px;border:1px solid var(--accent);border-radius:6px;background:var(--bg);text-align:right;font-weight:600}
.big.up,.big.down{transition:color .3s}
.big.down{color:var(--good)}
.line{transition:background .3s}
.line.paid{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{top:105vh;transform:rotate(720deg) translateX(40px)}}
@media (max-width:760px){.q-amt-wrap{flex:1}.q-amt-wrap .q-amt{width:100%}.debt-meta{margin-left:0}}
@media (max-width:760px){.summary{grid-template-columns:1fr}.summary .op{display:none}.summary .big{font-size:24px}}
.cut-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.cut-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.cut-head h2{margin:0;font-size:16px;flex:1}
.cut-head .badge{background:var(--blue-soft);color:var(--blue);font-weight:600;font-size:12px;padding:3px 10px;border-radius:999px}
.sec{padding:12px 16px;border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:0}
.sec-t{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.sec-t a{cursor:pointer;color:var(--accent);text-transform:none;letter-spacing:0;font-weight:600}
.line{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px dashed var(--border)}
.line:first-of-type{border-top:0}
.grp{display:flex;justify-content:space-between;gap:8px;margin:12px 0 2px;padding:4px 8px;border-radius:6px;background:var(--surface-2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.grp + .line{border-top:0}
.line .nm{flex:1;min-width:0}
.line .nm small{display:block;color:var(--muted);font-size:12px}
.line .amt{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.line.overdue{background:linear-gradient(90deg,var(--bad-soft),transparent 70%)}
.line.paid .nm,.line.paid .amt{color:var(--muted);text-decoration:line-through}
.line input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.line .act{display:flex;opacity:.55}
.line:hover .act{opacity:1}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.tot.big{font-size:16px;font-weight:700;padding-top:8px}
.tot .k{color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);margin-left:4px;vertical-align:1px}
.tag.inst{background:var(--blue-soft);color:var(--blue)}
.tag.last{background:var(--warn-soft);color:var(--warn)}
.tag.share{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:6px 0 2px}
.bar span{display:block;height:100%;background:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:6px 0}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;background:var(--surface-2)}
tr.cur td{background:var(--accent-soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.act{text-align:right;width:1%}
td .sub{color:var(--muted);font-size:12px;white-space:normal}
.mini-bar{display:inline-block;height:8px;border-radius:4px;background:var(--accent);vertical-align:middle;margin-left:6px}
.mini-bar.neg{background:var(--bad)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tools select,.tools input{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.warn{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.welcome{padding:28px;text-align:center}
.welcome h2{margin:0 0 6px}
.welcome p{color:var(--muted);margin:0 0 16px}
/* modal */
.backdrop{position:fixed;inset:0;background:rgba(10,20,12,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:100%;max-width:600px;padding:22px}
.modal h2{margin:0 0 16px;font-size:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld>label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);width:100%}
.fld .hint{font-size:12px;color:var(--muted)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.preview{grid-column:1/-1;background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:860px){
  .shell{flex-direction:column}
  .side{width:auto;height:auto;flex-direction:row;align-items:center;padding:8px 12px;border-right:0;border-bottom:1px solid var(--border);overflow-x:auto;gap:6px}
  .logo{display:none}
  .tabs{flex-direction:row}
  .tab{width:auto;padding:8px 10px}

<body>
<div class="shell">
<aside class="side">
  <div class="logo" data-act="dashhome" title="Go to dashboard">Cio Budget Planner<small>Income vs expenses · 15th &amp; 30th</small></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="side-foot">
    <button class="btn sm primary" data-act="import" title="Load your starter or backup .json file"><i class="ic ic-folder-open" aria-hidden="true"></i> Import file</button>
    <button class="btn sm" data-act="export" title="Download a backup .json file"><i class="ic ic-save" aria-hidden="true"></i> Backup</button>
  </div>
</aside>
<div class="content">
  <div class="topbar">
    <div id="countdown" class="countdown"></div>
    <div class="fx" id="fx">
      <span class="fx-live" title="Live rate"><span class="dot"></span>Live</span>
      <input id="fx-amt" inputmode="decimal" value="1" aria-label="Amount to convert">
      <select id="fx-from" aria-label="From currency"></select>
      <button class="icon-btn" id="fx-swap" title="Swap currencies"><i class="ic ic-arrow-left-right" aria-hidden="true"></i></button>
      <select id="fx-to" aria-label="To currency"></select>
      <span class="fx-out" id="fx-out">…</span>
      <a class="icon-btn" id="fx-google" target="_blank" rel="noopener" title="Check this rate on Google"><i class="ic ic-external-link" aria-hidden="true"></i></a>
      <div class="fx-meta" id="fx-meta"></div>
    </div>
  </div>
  <main id="main"></main>
</div>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<script>
/* ---------- helpers ---------- */
const ic = (n, cls='') => `<i class="ic ic-${n} ${cls}" aria-hidden="true"></i>`;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => { const n = Number(String(v ?? '').replace(/,/g,'')); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2,'0');
const ymNow = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1); };
const idx = ym => { const [y,m] = ym.split('-').map(Number); return y*12 + m - 1; };
const fromIdx = i => Math.floor(i/12) + '-' + pad(i%12 + 1);
const ymAdd = (ym, n) => fromIdx(idx(ym) + n);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const ymLabel = (ym, short) => { if (!ym) return '—'; const [y,m] = ym.split('-').map(Number); return (short ? MONTHS[m-1].slice(0,3) : MONTHS[m-1]) + ' ' + y; };
let CUR = '₱';
const money = n => (n < 0 ? '−' : '') + CUR + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
const sum = (arr, f) => arr.reduce((s,x) => s + (f ? f(x) : x), 0);
const ICON = { edit: ic('pencil'), del: ic('trash') };

/* ---------- data ---------- */
const KEY = 'cio-budget-v1';
let storageOK = true;
let data = {incomes:[], bills:[], allocs:[], paid:{}, settings:{currency:'₱'}};
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) data = Object.assign(data, JSON.parse(raw)); }
  catch(e){ storageOK = false; }
  data.paid ||= {}; data.settings ||= {currency:'₱'}; CUR = data.settings.currency || '₱';
  if (!data.settings.trackFrom && (data.bills.length || data.incomes.length)){ data.settings.trackFrom = ymNow(); persist(); }
  fixStarterSchedule();
}
/* One-time fix: the first starter file started every installment one month too early.
   Only shifts starter installments that still have their original start month; never touches paid ticks. */
const STARTER_FIX = {"s01": ["2026-01", "2026-02"], "s02": ["2025-11", "2025-12"], "s03": ["2025-11", "2025-12"], "s04": ["2026-04", "2026-05"], "s05": ["2026-01", "2026-02"], "s06": ["2026-02", "2026-03"], "s07": ["2026-04", "2026-05"], "s08": ["2026-07", "2026-08"], "s09": ["2026-08", "2026-09"], "s10": ["2026-08", "2026-09"], "s11": ["2026-09", "2026-10"], "s12": ["2026-09", "2026-10"], "s17": ["2026-06", "2026-07"], "s18": ["2026-06", "2026-07"], "s19": ["2026-08", "2026-09"], "s20": ["2026-08", "2026-09"], "s23": ["2026-08", "2026-09"], "s24": ["2026-09", "2026-10"]};
function fixStarterSchedule(){
  if (data.settings.scheduleFix1) return;
  let n = 0;
  data.bills.forEach(b => { const f = STARTER_FIX[b.id]; if (b.kind === 'installment' && f && b.start === f[0]){ b.start = f[1]; n++; } });
  data.settings.scheduleFix1 = true;
  if (n || data.bills.length) persist();
}
/* Months before trackFrom were already paid (history from the sheet); from trackFrom on, ticks decide. */
const trackFrom = () => data.settings.trackFrom || ymNow();
function isPaid(b, ym){
  const v = data.paid[b.id + '|' + ym];
  if (v === true) return true;
  if (v === false) return false;
  return idx(ym) < idx(trackFrom());
}
function instStatus(b){
  const n = num(b.months), now = ymNow(), pays = [];
  for (let k = 1; k <= n; k++){
    const ym = ymAdd(b.start, k-1), amt = (k === n && num(b.final) > 0) ? num(b.final) : num(b.amount);
    pays.push({k, ym, amt, paid:isPaid(b, ym)});
  }
  const paid = pays.filter(p => p.paid), total = sum(pays, p => p.amt), paidAmt = sum(paid, p => p.amt);
  const expected = pays.filter(p => idx(p.ym) < idx(now)).length;
  const overdue = pays.filter(p => idx(p.ym) < idx(now) && !p.paid);
  const dueNow = pays.find(p => p.ym === now && !p.paid);
  const unpaid = pays.filter(p => !p.paid);
  return {n, pays, paidN:paid.length, paidAmt, total, price:num(b.price) || total, remaining:total - paidAmt,
    expected, overdue, dueNow, firstYm:pays[0]?.ym, lastYm:pays[n-1]?.ym,
    firstPaid:paid[0]?.ym, lastPaid:paid[paid.length-1]?.ym, lastUnpaid:unpaid[unpaid.length-1]?.ym, done: n > 0 && paid.length === n};
}
const installments = () => data.bills.filter(b => b.kind === 'installment' && b.start && num(b.months));
const cutDay = (ym, c) => { const [y,m] = ym.split('-').map(Number); return c === '15th' ? 15 : Math.min(30, new Date(y, m, 0).getDate()); };
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){ storageOK = false; } }

/* ---------- schemas ---------- */
const SCHEMA = {
  bills: { label:'Expense', fields:[
    {k:'name', l:'Expense name', t:'text', req:1, full:1, ph:'e.g. MacBook, House Rent'},
    {k:'kind', l:'Type', t:'select', opts:[['installment','Installment (fixed number of months)'],['monthly','Monthly / recurring'],['once','One-time (this month only)']], def:'installment', full:1},
    {k:'cutoff', l:'Pay from which cutoff', t:'select', opts:[['15th','15th cutoff'],['30th','30th cutoff']], def:'15th'},
    {k:'due', l:'Due date (optional)', t:'text', ph:'e.g. 20th'},
    {k:'amount', l:'Amount per payment', t:'number', req:1},
    {k:'price', l:'Total price (optional)', t:'number', show:{kind:['installment']}},
    {k:'start', l:'First payment month', t:'month', show:{kind:['installment','monthly']}, hint:'For monthly: leave blank if it has always been there.'},
    {k:'months', l:'Number of months to pay', t:'number', show:{kind:['installment']}},
    {k:'final', l:'Last payment amount (if different)', t:'number', show:{kind:['installment']}},
    {k:'end', l:'Last month (optional)', t:'month', show:{kind:['monthly']}, hint:'Leave blank if ongoing.'},
    {k:'month', l:'Month', t:'month', show:{kind:['once']}},
    {k:'account', l:'Bank / account', t:'text', ph:'e.g. BDO, East West'},
    {k:'notes', l:'Notes', t:'text', full:1},
  ]},
  incomes: { label:'Income', fields:[
    {k:'name', l:'Income name', t:'text', req:1, full:1, ph:'e.g. CIO (ETC)'},
    {k:'kind', l:'Kind', t:'select', opts:[['salary','My income / salary'],['share','Share from someone else (e.g. Josh)']], def:'salary', full:1, hint:'A share is subtracted from the bills you pay for that cutoff.'},
    {k:'cutoff', l:'Cutoff', t:'select', opts:[['15th','15th cutoff'],['30th','30th cutoff']], def:'15th'},
    {k:'amount', l:'Amount', t:'number', req:1},
    {k:'recur', l:'How often', t:'select', opts:[['monthly','Every month'],['once','One-time (one month only)']], def:'monthly'},
    {k:'start', l:'Starts (optional)', t:'month', show:{recur:['monthly']}},
    {k:'end', l:'Ends (optional)', t:'month', show:{recur:['monthly']}},
    {k:'month', l:'Month', t:'month', show:{recur:['once']}},
    {k:'notes', l:'Notes', t:'text', full:1},
  ]},
  allocs: { label:'Allocation', fields:[
    {k:'name', l:'Bucket name', t:'text', req:1, ph:'e.g. Savings, Play money, Emergency fund'},
    {k:'where', l:'Where it goes (optional)', t:'text', ph:'e.g. GoTyme'},
    {k:'cutoff', l:'Cutoff', t:'select', opts:[['15th','15th cutoff'],['30th','30th cutoff']], def:'15th'},
    {k:'mode', l:'How much', t:'select', opts:[['fixed','Fixed amount'],['pct','% of what is left']], def:'fixed'},
    {k:'value', l:'Amount or %', t:'number', req:1, hint:'Fixed amounts come out first, then % buckets split what remains.'},
  ]},
};

/* ---------- calculations ---------- */
// Installments first, shortest term first (3, 6, 12…); within a term, fewest payments left first. Then monthly, then one-time.
const kindRank = k => k === 'installment' ? 0 : k === 'monthly' ? 1 : 2;
function billOrder(a, b){
  return kindRank(a.b.kind) - kindRank(b.b.kind)
    || (a.n || 0) - (b.n || 0)
    || ((a.n - a.k) || 0) - ((b.n - b.k) || 0)
    || a.b.name.localeCompare(b.b.name);
}
const groupOf = r => r.b.kind === 'installment' ? `${r.n}-month installments` : r.b.kind === 'monthly' ? 'Monthly bills' : 'One-time';
function billFor(b, ym){
  const i = idx(ym);
  if (b.kind === 'once') return b.month === ym ? {amt:num(b.amount)} : null;
  if (b.kind === 'monthly'){
    if (b.start && i < idx(b.start)) return null;
    if (b.end && i > idx(b.end)) return null;
    return {amt:num(b.amount)};
  }
  if (!b.start || !num(b.months)) return null;
  const k = i - idx(b.start) + 1, n = num(b.months);
  if (k < 1 || k > n) return null;
  const amt = (k === n && num(b.final) > 0) ? num(b.final) : num(b.amount);
  return {amt, k, n};
}
function incomeFor(x, ym){
  if (x.recur === 'once') return x.month === ym ? num(x.amount) : 0;
  const i = idx(ym);
  if (x.start && i < idx(x.start)) return 0;
  if (x.end && i > idx(x.end)) return 0;
  return num(x.amount);
}
function cutoff(ym, c){
  const inc = data.incomes.filter(x => x.cutoff === c).map(x => ({x, amt:incomeFor(x, ym)})).filter(r => r.amt);
  const salary = inc.filter(r => r.x.kind !== 'share'), shares = inc.filter(r => r.x.kind === 'share');
  const bills = data.bills.filter(b => b.cutoff === c).map(b => ({b, ...billFor(b, ym)})).filter(r => r.amt)
    .sort(billOrder);
  const incomeT = sum(salary, r => r.amt), shareT = sum(shares, r => r.amt), billT = sum(bills, r => r.amt);
  const youPay = billT - shareT, left = incomeT - youPay;
  const al = data.allocs.filter(a => a.cutoff === c);
  const fixed = al.filter(a => a.mode !== 'pct').map(a => ({a, amt:num(a.value)}));
  const fixedT = sum(fixed, r => r.amt);
  const rest = Math.max(0, left - fixedT);
  const pct = al.filter(a => a.mode === 'pct').map(a => ({a, amt:Math.round(rest * num(a.value) / 100)}));
  const allocs = [...fixed, ...pct];
  const allocT = sum(allocs, r => r.amt);
  const paidN = bills.filter(r => isPaid(r.b, ym)).length;
  return {salary, shares, bills, incomeT, shareT, billT, youPay, left, allocs, allocT, unalloc:left - allocT, paidN};
}
function month(ym){
  const a = cutoff(ym,'15th'), b = cutoff(ym,'30th');
  const buckets = {};
  [...a.allocs, ...b.allocs].forEach(r => { buckets[r.a.name] = (buckets[r.a.name]||0) + r.amt; });
  return {a, b, income:a.incomeT+b.incomeT, youPay:a.youPay+b.youPay, bills:a.billT+b.billT, shares:a.shareT+b.shareT, left:a.left+b.left, buckets, unalloc:a.unalloc+b.unalloc};
}
const bucketNames = () => [...new Set(data.allocs.map(a => a.name))];

/* ---------- UI state ---------- */
const ui = {view:'dash', ym:ymNow(), year:Number(ymNow().slice(0,4)), billFilter:'all', billCut:'all'};
const VIEWS = [['dash','Dashboard','layout-dashboard'],['month','Monthly','calendar-days'],['bills','Expenses','receipt'],['paid','Paid','badge-check'],['income','Income & Savings','wallet']];
function renderTabs(){
  const overdue = installments().reduce((n, b) => n + instStatus(b).overdue.length, 0);
  $('#tabs').innerHTML = VIEWS.map(([k,l,i]) => `<button class="tab ${ui.view===k?'on':''}" data-act="view" data-v="${k}">${ic(i)} ${l}${k==='paid'&&overdue?`<span class="ct" title="Overdue installment payments">${overdue}</span>`:''}</button>`).join('');
}
/* ---------- navigation history ---------- */
const routeOf = () => ui.view==='month' ? 'month/'+ui.ym : ui.view==='dash' ? 'dash/'+ui.year : ui.view;
function go(change){
  const before = routeOf(); Object.assign(ui, change);
  if (routeOf() !== before){ try { history.pushState(null, '', '#' + routeOf()); navDepth++; } catch(e){} }
  render(); scrollTo(0,0);
}
function readRoute(){
  const [v, arg] = (location.hash.slice(1) || '').split('/');
  if (v === 'month' && /^\d{4}-\d{2}$/.test(arg||'')){ ui.view = 'month'; ui.ym = arg; }
  else if ((v === 'dash' || v === 'year') && /^\d{4}$/.test(arg||'')){ ui.view = 'dash'; ui.year = Number(arg); }
  else if (v === 'bills' || v === 'income' || v === 'paid'){ ui.view = v; }
  else { ui.view = 'dash'; ui.year = Number(ymNow().slice(0,4)); }
}
window.addEventListener('popstate', () => { readRoute(); closeModal(); render(); });
let navDepth = 0;
window.addEventListener('popstate', () => { if (navDepth > 0) navDepth--; });
function backBar(){
  const atHome = (ui.view === 'month' && ui.ym === ymNow()) || (ui.view === 'dash' && ui.year === Number(ymNow().slice(0,4)));
  if (atHome || navDepth === 0 && ui.view !== 'month') return '';
  return `<div class="backbar"><button class="btn" data-act="back">${ic('arrow-left')} Back</button><button class="btn" data-act="home">${ic('house')} This month (${ymLabel(ymNow(), true)})</button></div>`;
}

function render(){
  renderTabs();
  let h = storageOK ? '' : `<div class="warn">Your browser is blocking storage here, so changes won't be kept after you close the page. Open it from your website in Chrome to save normally.</div>`;
  if (!data.incomes.length && !data.bills.length) h += welcome();
  else h += backBar() + ({dash:viewDash, month:viewMonth, bills:viewBills, paid:viewPaid, income:viewIncome})[ui.view]();
  $('#main').innerHTML = h;
  renderCountdown();
  afterRender();
}
function welcome(){
  return `<div class="card welcome"><h2>Let's set up your budget</h2>
    <p>Import your starter file to load your current income, bills and installments, or start from scratch.</p>
    <button class="btn primary" data-act="import">Import starter / backup file</button>
    <button class="btn" data-act="add" data-store="incomes">${ic('plus')} Add income</button>
    <button class="btn" data-act="add" data-store="bills">${ic('plus')} Add expense</button></div>`;
}
const footer = () => `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:26px;align-items:center;color:var(--muted);font-size:12px">
  <span>Saved in this browser.</span>
  <button class="btn sm" data-act="export">Export backup</button><button class="btn sm" data-act="import">Import backup</button>
  <label style="margin-left:auto">Currency <select id="cur" style="padding:3px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface)">${['₱','$','A$','£','€'].map(c=>`<option ${c===CUR?'selected':''}>${c}</option>`).join('')}</select></label></div>`;

/* ---------- Monthly view ---------- */
function monthChips(){
  const y = Number(ui.ym.slice(0,4)), now = ymNow();
  return `<div class="months">
    <button class="mchip" data-act="ym" data-v="${ymAdd(ui.ym,-12)}">${ic('chevron-left')} ${y-1}</button>
    ${MONTHS.map((m,i) => { const ym = y + '-' + pad(i+1); return `<button class="mchip ${ym===ui.ym?'on':''} ${ym===now?'now':''}" data-act="ym" data-v="${ym}">${m}</button>`; }).join('')}
    <button class="mchip" data-act="ym" data-v="${ymAdd(ui.ym,12)}">${y+1} ${ic('chevron-right')}</button></div>`;
}
function viewMonth(){
  const ym = ui.ym, M = month(ym);
  const bucketStats = Object.entries(M.buckets).map(([n,v]) => `<div class="card stat"><div class="lbl">${esc(n)}</div><div class="num">${money(v)}</div><div class="sub">set aside this month</div></div>`).join('');
  return `<div class="head"><h1>${ymLabel(ym)}</h1>
      <button class="btn" data-act="ym" data-v="${ymAdd(ym,-1)}">${ic('chevron-left')} Prev</button><button class="btn" data-act="ym" data-v="${ymAdd(ym,1)}">Next ${ic('chevron-right')}</button>
      <button class="btn primary" data-act="add" data-store="bills" data-ym="${ym}">${ic('plus')} Add expense</button></div>
    ${monthChips()}
    <div class="card summary">
      <div class="sum-col"><div class="lbl">Total income</div><div class="big" data-count="income" data-to="${M.income}">${money(M.income)}</div></div>
      <div class="op">−</div>
      <div class="sum-col"><div class="lbl">Total expenses</div><div class="big" data-count="exp" data-to="${M.youPay}">${money(M.youPay)}</div>${M.shares?`<div class="sub">${money(M.bills)} bills − ${money(M.shares)} shared</div>`:''}</div>
      <div class="op">=</div>
      <div class="sum-col"><div class="lbl">Left this month</div><div class="big ${M.left<0?'neg':'pos'}" data-count="left" data-to="${M.left}">${money(M.left)}</div></div>
      <table class="sum-tbl"><thead><tr><th></th><th class="num">Income</th><th class="num">Expenses</th><th class="num">Left</th></tr></thead><tbody>
        <tr><td>15th cutoff</td><td class="num">${money(M.a.incomeT)}</td><td class="num">${money(M.a.youPay)}</td><td class="num ${M.a.left<0?'neg':''}"><b>${money(M.a.left)}</b></td></tr>
        <tr><td>30th cutoff</td><td class="num">${money(M.b.incomeT)}</td><td class="num">${money(M.b.youPay)}</td><td class="num ${M.b.left<0?'neg':''}"><b>${money(M.b.left)}</b></td></tr>
        <tr class="total"><td>Month total</td><td class="num">${money(M.income)}</td><td class="num">${money(M.youPay)}</td><td class="num ${M.left<0?'neg':''}">${money(M.left)}</td></tr>
      </tbody></table>
    </div>
    ${quickAdd(ym)}
    ${data.allocs.length ? `<div class="stats">${bucketStats}<div class="card stat"><div class="lbl">Free / unallocated</div><div class="num ${M.unalloc<0?'neg':''}">${money(M.unalloc)}</div></div></div>` : ''}
    <div class="cut-grid">${cutCard(ym,'15th',M.a)}${cutCard(ym,'30th',M.b)}</div>${footer()}`;
}
function rowActs(store, id){
  return `<span class="act"><button class="icon-btn" title="Edit" data-act="edit" data-store="${store}" data-id="${id}">${ICON.edit}</button><button class="icon-btn del" title="Delete" data-act="del" data-store="${store}" data-id="${id}">${ICON.del}</button></span>`;
}
function cutCard(ym, c, C){
  const pctPaid = C.bills.length ? Math.round(C.paidN / C.bills.length * 100) : 0;
  const billLine = r => {
    const b = r.b, paid = isPaid(b, ym);
    const overdueMark = !paid && idx(ym) < idx(ymNow());
    let tag = '';
    if (b.kind === 'installment') tag = `<span class="tag inst">${r.k} of ${r.n}</span>${r.k===r.n?'<span class="tag last">last payment</span>':''}`;
    else if (b.kind === 'once') tag = '<span class="tag">one-time</span>';
    const sub = [b.due && 'due ' + b.due, b.account, b.kind==='installment' && r.k < r.n && 'ends ' + ymLabel(ymAdd(b.start, r.n-1), true)].filter(Boolean).join(' · ');
    return `<div class="line ${paid?'paid':''} ${overdueMark?'overdue':''}"><input type="checkbox" data-paid="${b.id}|${ym}" ${paid?'checked':''} title="Mark as paid"><div class="nm">${esc(b.name)}${tag}${sub?`<small>${esc(sub)}</small>`:''}</div><div class="amt editable" data-edit="bills|${b.id}" title="Tap to change amount">${money(r.amt)}</div>${rowActs('bills', b.id)}</div>`;
  };
  return `<div class="card">
    <div class="cut-head"><h2>${c} cutoff</h2><span class="badge">${C.paidN}/${C.bills.length} paid</span></div>
    <div class="sec"><div class="sec-t">Income <a data-act="add" data-store="incomes" data-cut="${c}">${ic('plus')} Add</a></div>
      ${C.salary.length ? C.salary.map(r => `<div class="line"><div class="nm">${esc(r.x.name)}${r.x.recur==='once'?'<span class="tag">one-time</span>':''}</div><div class="amt editable" data-edit="incomes|${r.x.id}" title="Tap to change amount">${money(r.amt)}</div>${rowActs('incomes', r.x.id)}</div>`).join('') : '<div class="empty">No income for this cutoff</div>'}
    </div>

        return `<div class="grp"><span>${g}</span><span>${grp.length} · ${money(sum(grp, x => x.amt))}</span></div>` + billLine(r);
      }).join('') : '<div class="empty">No bills this cutoff</div>'}
    </div>
    <div class="sec">
      <div class="tot"><span class="k">Total bills</span><span>${money(C.billT)}</span></div>
      ${C.shares.map(r => `<div class="tot"><span class="k">− ${esc(r.x.name)} <span class="tag share">share</span></span><span>${money(r.amt)}</span></div>`).join('')}

      <div class="tot"><span class="k">Income</span><span>${money(C.incomeT)}</span></div>

      <div class="tot big"><span>Free / unallocated</span><span class="${C.unalloc<0?'neg':''}">${money(C.unalloc)}</span></div>
      ${C.unalloc < 0 ? `<p class="note neg">Your buckets add up to more than what's left. Lower a bucket or an expense.</p>` : ''}

/* ---------- Debt-free countdown (top bar) ---------- */
function debtInfo(){
  let total = 0, paid = 0, last = null, lastBill = null, payLeft = 0;
  installments().forEach(b => {
    const st = instStatus(b);
    total += st.total; paid += st.paidAmt;
    st.pays.forEach(p => { if (!p.paid){ payLeft++; const d = new Date(+p.ym.slice(0,4), +p.ym.slice(5)-1, cutDay(p.ym, b.cutoff)); if (!last || d > last){ last = d; lastBill = b; } } });
  });
  return {total, paid, owed: total - paid, last, lastBill, payLeft, pct: total ? Math.round(paid / total * 100) : 100};
}
function renderCountdown(){
  const el = $('#countdown'); if (!el) return;
  if (!data.bills.length){ el.innerHTML = ''; return; }
  const D = debtInfo();
  if (!D.last){ el.innerHTML = `<div class="cd-icon">${ic('trophy')}</div><div class="cd-side"><div class="cd-num"><b>Debt-free!</b></div><div class="cd-text">All installments are fully paid. Amazing.</div></div>`; return; }
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.max(0, Math.ceil((D.last - today) / 86400000));
  const mos = (D.last.getFullYear() - today.getFullYear()) * 12 + D.last.getMonth() - today.getMonth();
  const human = mos >= 12 ? `${Math.floor(mos/12)} yr${mos>=24?'s':''}${mos%12?` ${mos%12} mo${mos%12>1?'s':''}`:''}` : `${mos} mo${mos!==1?'s':''}`;
  el.innerHTML = `<div class="cd-icon">${ic('hourglass')}</div>
    <div class="cd-num"><b data-count="cd" data-to="${days}">${days.toLocaleString()}</b><span>days to<br>debt-free</span></div>
    <div class="cd-side"><div class="cd-text"><b>${D.pct}% paid</b> · ${money(D.owed)} to go · ${D.payLeft} payments · done by <b>${D.last.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</b> (~${human})</div>
    <div class="bar"><span style="width:${D.pct}%"></span></div></div>`;
}

/* ---------- Dashboard (year summary) ---------- */
function yearsRange(){
  let min = Number(ymNow().slice(0,4)), max = min;
  const upd = ym => { if (!ym) return; const y = Number(ym.slice(0,4)); if (y){ min = Math.min(min, y); max = Math.max(max, y); } };
  data.bills.forEach(b => { upd(b.start); upd(b.month); upd(b.end); if (b.kind === 'installment' && b.start && num(b.months)) upd(ymAdd(b.start, num(b.months)-1)); });
  data.incomes.forEach(x => { upd(x.start); upd(x.month); upd(x.end); });
  return [min, max];
}

      <div class="card kpi"><div class="lbl">Bills paid in ${y}</div><div class="num">${pctPaid}%</div><div class="bar"><span style="width:${pctPaid}%"></span></div><div class="sub">${money(paidAmt)} paid · ${money(unpaidAmt)} to go${overdueAmt?` · <span class="neg">${money(overdueAmt)} overdue</span>`:''}</div></div>
    </div>
    <div class="dash-grid">

/* ---------- Paid tab ---------- */
function viewPaid(){

  const done = inst.filter(r => r.st.done).sort((a,b) => idx(b.st.lastYm) - idx(a.st.lastYm));
  const onceDone = data.bills.filter(b => b.kind === 'once' && b.month && isPaid(b, b.month)).sort((a,b) => idx(b.month) - idx(a.month));
  const running = inst.filter(r => !r.st.done).sort((a,b) => b.st.overdue.length - a.st.overdue.length || idx(a.st.lastYm) - idx(b.st.lastYm));
  const range = (a, b) => !a ? '—' : a === b ? ymLabel(a) : `${ymLabel(a)} – ${ymLabel(b)}`;
  const status = st => st.overdue.length ? `<span class="pill bad">${ic('circle-alert')} ${st.overdue.length} overdue</span>`
    : st.dueNow ? `<span class="pill warn">${ic('clock')} Due this month</span>`
    : st.paidN > st.expected + 1 ? `<span class="pill good">${ic('circle-check')} Ahead</span>`

  const paidOffTotal = sum(done, r => r.st.total) + sum(onceDone, b => num(b.amount));

          <td>${range(r.st.firstYm, r.st.lastYm)}</td><td class="num">${r.st.n}</td><td class="num">${money(num(r.b.amount))}${num(r.b.final)>0?`<div class="sub">last: ${money(num(r.b.final))}</div>`:''}</td>
          <td class="num">${money(r.st.price)}</td><td class="num"><b>${money(r.st.total)}</b></td></tr>`).join('')}
        ${onceDone.map(b => `<tr><td><b>${esc(b.name)}</b><div class="sub">one-time · ${b.cutoff} cutoff</div></td><td>${ymLabel(b.month)}</td><td class="num">1</td><td class="num">—</td><td class="num">${money(num(b.amount))}</td><td class="num"><b>${money(num(b.amount))}</b></td></tr>`).join('')}

          <td><b>${esc(r.b.name)}</b><div class="sub">${esc([r.b.account, r.b.cutoff + ' cutoff', 'ends ' + ymLabel(st.lastYm, true)].filter(Boolean).join(' · '))}</div></td>

/* ---------- Expenses list ---------- */
function viewBills(){
  const f = ui.billFilter, c = ui.billCut, now = ymNow();
  const status = b => {
    if (b.kind === 'once') return idx(b.month||now) < idx(now) ? 'done' : 'active';
    if (b.kind === 'installment') return (b.start && num(b.months) && idx(ymAdd(b.start, num(b.months)-1)) < idx(now)) ? 'done' : 'active';
    return (b.end && idx(b.end) < idx(now)) ? 'done' : 'active';
  };
  const rows = data.bills.filter(b => (f==='all' ? status(b)==='active' : f==='done' ? status(b)==='done' : b.kind===f && status(b)==='active') && (c==='all' || b.cutoff===c))
    .sort((a,b) => a.cutoff.localeCompare(b.cutoff) || a.name.localeCompare(b.name));
  const sched = b => b.kind==='installment' ? `${ymLabel(b.start,true)} → ${b.start&&num(b.months)?ymLabel(ymAdd(b.start,num(b.months)-1),true):'?'} (${num(b.months)} mos)`
    : b.kind==='once' ? ymLabel(b.month,true) : (b.start?'from '+ymLabel(b.start,true):'every month') + (b.end?' until '+ymLabel(b.end,true):'');
  const label = {installment:'Installment', monthly:'Monthly', once:'One-time'};
  return `<div class="head"><h1>Expenses</h1><button class="btn primary" data-act="add" data-store="bills">${ic('plus')} Add expense</button></div>
    <div class="tools">
      <select id="bf">${[['all','All active'],['installment','Installments'],['monthly','Monthly'],['once','One-time'],['done','Finished']].map(([v,l])=>`<option value="${v}" ${f===v?'selected':''}>${l}</option>`).join('')}</select>
      <select id="bc">${[['all','Both cutoffs'],['15th','15th cutoff'],['30th','30th cutoff']].map(([v,l])=>`<option value="${v}" ${c===v?'selected':''}>${l}</option>`).join('')}</select>
    </div>
    <div class="card">${rows.length ? `<div class="tbl-wrap"><table>
      <thead><tr><th>Expense</th><th>Type</th><th>Cutoff</th><th class="num">Amount</th><th>Schedule</th><th></th></tr></thead>
      <tbody>${rows.map(b => `<tr><td><b>${esc(b.name)}</b>${(b.account||b.notes)?`<div class="sub">${esc([b.account,b.notes].filter(Boolean).join(' · '))}</div>`:''}</td>
        <td>${label[b.kind]}</td><td>${b.cutoff}${b.due?` <span class="tag">due ${esc(b.due)}</span>`:''}</td><td class="num">${money(num(b.amount))}</td><td>${sched(b)}</td>
        <td class="act"><button class="icon-btn" data-act="edit" data-store="bills" data-id="${b.id}" title="Edit">${ICON.edit}</button><button class="icon-btn del" data-act="del" data-store="bills" data-id="${b.id}" title="Delete">${ICON.del}</button></td></tr>`).join('')}
      </tbody></table></div>` : '<div class="pad empty">Nothing here yet.</div>'}</div>${footer()}`;
}

/* ---------- Income & savings ---------- */
function viewIncome(){
  const byCut = (arr, c) => arr.filter(x => x.cutoff === c);
  const incRows = c => byCut(data.incomes, c).map(x => `<tr><td><b>${esc(x.name)}</b>${x.kind==='share'?'<span class="tag share">share</span>':''}${x.notes?`<div class="sub">${esc(x.notes)}</div>`:''}</td>

    <div class="sec"><div class="sec-t">Savings, play money &amp; other buckets <a data-act="add" data-store="allocs" data-cut="${c}">${ic('plus')} Add</a></div>

  return `<div class="head"><h1>Income &amp; Savings</h1><button class="btn primary" data-act="add" data-store="incomes">${ic('plus')} Add income</button><button class="btn" data-act="add" data-store="allocs">${ic('plus')} Add bucket</button></div>

/* ---------- interactive bits ---------- */
const qa = {cutoff:null, kind:'once', months:3};
function quickAdd(ym){
  if (!qa.cutoff) qa.cutoff = (ym === ymNow() && new Date().getDate() > 15) ? '30th' : '15th';
  const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v,l]) => `<button type="button" class="${qa[key]===v?'on':''}" data-seg="${key}" data-val="${v}">${l}</button>`).join('')}</div>`;
  return `<div class="card quick">
    <div class="q-title">${ic('zap','lg')} Quick add an expense to ${ymLabel(ym)}</div>
    <form id="qa" autocomplete="off">
      <input name="qname" class="q-name" placeholder="What is it? e.g. Meralco, Shopee" aria-label="Expense name">
      <div class="q-amt-wrap"><span>${esc(CUR)}</span><input name="amount" class="q-amt" inputmode="decimal" placeholder="0" aria-label="Amount"></div>
      ${seg('cutoff', [['15th','15th'],['30th','30th']])}
      ${seg('kind', [['once','One-time'],['monthly','Every month'],['installment','Installment']])}
      <label class="q-months" ${qa.kind==='installment'?'':'hidden'}>for <input name="months" type="number" min="2" value="${qa.months}"> months</label>
      <button class="btn primary" type="submit">Add</button>
    </form>
    <div class="q-impact" id="qi">Type an amount to see how much will be left.</div>
  </div>`;
}
function qaImpact(){
  const f = $('#qa'); if (!f) return;
  const amt = num(f.amount.value), ym = ui.ym, c = qa.cutoff, C = cutoff(ym, c), el = $('#qi');
  if (!amt){ el.className = 'q-impact'; el.innerHTML = 'Type an amount to see how much will be left.'; return; }
  const after = C.left - amt, M = month(ym);
  let span = qa.kind === 'once' ? 'only this month' : qa.kind === 'monthly' ? `every month from ${ymLabel(ym, true)}` : `${num(f.months.value)||qa.months} months · ${ymLabel(ym,true)} → ${ymLabel(ymAdd(ym,(num(f.months.value)||qa.months)-1),true)} · ${money(amt*(num(f.months.value)||qa.months))} total`;
  el.className = 'q-impact ' + (after < 0 ? 'bad' : after < C.left * 0.25 ? 'meh' : 'ok');
  el.innerHTML = `${c} cutoff left: <b>${money(C.left)}</b> ${ic('arrow-right')} <b>${money(after)}</b> &nbsp;·&nbsp; month left: ${money(M.left)} ${ic('arrow-right')} <b>${money(M.left - amt)}</b><br><small>${span}${after < 0 ? ' · ' + ic('triangle-alert') + ' this puts the cutoff in the negative' : ''}</small>`;
}
function debtCard(){
  const now = ymNow();
  let total = 0, paidAmt = 0, payLeft = 0, last = null;
  data.bills.filter(b => b.kind === 'installment' && b.start && num(b.months)).forEach(b => {
    const n = num(b.months);
    for (let k = 1; k <= n; k++){
      const ym = ymAdd(b.start, k-1), a = (k === n && num(b.final) > 0) ? num(b.final) : num(b.amount);
      total += a;
      if (isPaid(b, ym)) paidAmt += a; else { payLeft++; if (!last || idx(ym) > idx(last)) last = ym; }
    }
  });
  if (!total) return '';
  const pct = Math.round(paidAmt / total * 100);
  return `<div class="card debt"><div class="debt-top"><div><div class="lbl">${ic('trending-down')} Installments paid off</div><div class="debt-pct">${pct}%</div></div>
    <div class="debt-meta"><b>${money(total - paidAmt)}</b> still owed · <b>${payLeft}</b> payments to go${last?` · debt-free by <b>${ymLabel(last)}</b>`:''}</div></div>
    <div class="bar big-bar"><span style="width:${pct}%"></span></div></div>`;
}
const prevCount = {};
function afterRender(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-count]').forEach(el => {
    const key = el.dataset.count, to = num(el.dataset.to), from = prevCount[key] ?? to;
    prevCount[key] = to;
    if (reduce || from === to) return;
    const t0 = performance.now(), dur = 500;
    el.classList.add(to > from ? 'up' : 'down');
    const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = key === 'cd' ? Math.round(from + (to - from) * e).toLocaleString() : money(Math.round(from + (to - from) * e)); if (p < 1) requestAnimationFrame(step); else setTimeout(() => el.classList.remove('up','down'), 400); };
    requestAnimationFrame(step);
  });
  const f = $('#qa');
  if (f){
    f.addEventListener('input', e => { if (e.target.name === 'months') qa.months = num(e.target.value) || 3; qaImpact(); });
    f.addEventListener('submit', e => {
      e.preventDefault();
      const name = f.qname.value.trim(), amount = num(f.amount.value), months = num(f.months.value) || qa.months;
      if (!name){ toast('Give it a name first'); f.qname.focus(); return; }
      if (!amount){ toast('Enter an amount'); f.amount.focus(); return; }
      const ym = ui.ym;
      data.bills.push({id:uid(), name, kind:qa.kind, cutoff:qa.cutoff, due:'', amount, price:qa.kind==='installment'?amount*months:'', start:qa.kind==='once'?'':ym, months:qa.kind==='installment'?months:'', final:'', end:'', month:qa.kind==='once'?ym:'', account:'', notes:''});
      persist(); render(); toast(`Added ${name} · ${money(amount)}`);
      const nf = $('#qa'); if (nf) nf.qname.focus();
    });
  }
}
function celebrate(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#2f6b3f','#6fbf86','#e8d562','#2c5d8a','#e0a64b','#ec7a6d'];
  const box = document.createElement('div'); box.className = 'confetti';
  for (let i = 0; i < 80; i++){
    const p = document.createElement('i');
    p.style.left = Math.random()*100 + 'vw'; p.style.background = colors[i % colors.length];
    p.style.animationDelay = Math.random()*0.4 + 's'; p.style.animationDuration = 1.6 + Math.random()*1.2 + 's';
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    box.appendChild(p);
  }

}
function startInlineEdit(el){
  const [store, id] = el.dataset.edit.split('|'), rec = data[store].find(r => r.id === id); if (!rec) return;
  const old = num(rec.amount);
  el.innerHTML = `<input class="inline-amt" inputmode="decimal" value="${old}">`;
  const inp = el.querySelector('input'); inp.focus(); inp.select();
  let done = false;
  const finish = save => {
    if (done) return; done = true;
    const v = num(inp.value);
    if (save && v > 0 && v !== old){ rec.amount = v; persist(); render(); toast(`${rec.name}: ${money(old)} → ${money(v)}`); }
    else render();
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
  inp.addEventListener('blur', () => finish(true));
}

/* ---------- live currency converter ---------- */
const FX_CODES = [['PHP','₱'],['USD','$'],['AUD','A$'],['GBP','£'],['EUR','€'],['SGD','S$'],['CAD','C$'],['JPY','¥'],['HKD','HK$'],['AED','AED '],['THB','฿'],['KRW','₩']];
const fx = {rates:null, time:0, fetched:0, src:'', state:{amt:'1', from:'USD', to:'PHP'}};
function fxSave(){ try { localStorage.setItem('cio-fx', JSON.stringify({rates:fx.rates, time:fx.time, fetched:fx.fetched, src:fx.src, state:fx.state})); } catch(e){} }
function fxLoadCache(){ try { const c = JSON.parse(localStorage.getItem('cio-fx') || 'null'); if (c){ Object.assign(fx, {rates:c.rates, time:c.time, fetched:c.fetched, src:c.src}); if (c.state) fx.state = c.state; } } catch(e){} }
async function fxFetch(force){
  if (!force && fx.rates && Date.now() - fx.fetched < 30*60*1000) return fxShow();
  const live = document.querySelector('.fx-live');
  try {
    const r = await fetch('https://open.er-api.com/v6/latest/USD', {cache:'no-store'});
    const j = await r.json();
    if (j.result !== 'success' || !j.rates) throw new Error('bad response');
    Object.assign(fx, {rates:j.rates, time:j.time_last_update_unix*1000, fetched:Date.now(), src:'ExchangeRate-API'});
  } catch(e){
    try {
      const r = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json', {cache:'no-store'});
      const j = await r.json(), rates = {};
      Object.entries(j.usd || {}).forEach(([k,v]) => rates[k.toUpperCase()] = v);
      if (!rates.PHP) throw new Error('no rates');
      Object.assign(fx, {rates, time:new Date(j.date + 'T00:00:00Z').getTime(), fetched:Date.now(), src:'Currency API'});
    } catch(e2){ if (live) live.classList.add('off'); fxShow(true); return; }
  }
  if (live) live.classList.remove('off');
  fxSave(); fxShow(false, true);
}
function fxShow(failed, flash){
  const out = $('#fx-out'), meta = $('#fx-meta'), {amt, from, to} = fx.state;
  $('#fx-google').href = `https://www.google.com/search?q=${encodeURIComponent((num(amt)||1) + ' ' + from + ' to ' + to)}`;
  if (!fx.rates){ out.textContent = '—'; meta.textContent = failed ? 'Rates unavailable right now. Tap the link icon to check on Google.' : 'Loading rates…'; return; }
  const val = num(amt) * fx.rates[to] / fx.rates[from];
  const sym = (FX_CODES.find(c => c[0] === to) || [,''])[1];
  out.textContent = sym + val.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
  if (flash){ out.classList.remove('flash'); void out.offsetWidth; out.classList.add('flash'); }
  const unit = fx.rates[to] / fx.rates[from];
  const mins = Math.round((Date.now() - fx.fetched) / 60000);
  meta.textContent = `1 ${from} = ${unit.toLocaleString(undefined,{maximumFractionDigits:4})} ${to} · rate updated ${new Date(fx.time).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} · checked ${mins < 1 ? 'just now' : mins + ' min ago'}${failed ? ' · offline, showing last saved rate' : ''}`;
}
function fxInit(){
  fxLoadCache();
  const opts = sel => FX_CODES.map(([c]) => `<option ${c===sel?'selected':''}>${c}</option>`).join('');
  $('#fx-from').innerHTML = opts(fx.state.from); $('#fx-to').innerHTML = opts(fx.state.to); $('#fx-amt').value = fx.state.amt;
  const upd = () => { fx.state = {amt:$('#fx-amt').value, from:$('#fx-from').value, to:$('#fx-to').value}; fxSave(); fxShow(); };
  $('#fx-amt').addEventListener('input', upd);
  $('#fx-from').addEventListener('change', upd); $('#fx-to').addEventListener('change', upd);
  $('#fx-swap').addEventListener('click', () => { const f = $('#fx-from').value; $('#fx-from').value = $('#fx-to').value; $('#fx-to').value = f; upd(); });
  fxShow(); fxFetch();
  setInterval(() => fxFetch(true), 30*60*1000);   // refresh every 30 minutes
  setInterval(() => fx.rates && fxShow(), 60*1000);  // keep "checked x min ago" current
}

/* ---------- forms ---------- */
function showModal(html){
  $('#modal-root').innerHTML = `<div class="backdrop" id="bd"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#bd').addEventListener('mousedown', e => { if (e.target.id === 'bd') closeModal(); });
}
function closeModal(){ $('#modal-root').innerHTML = ''; }
function fieldHTML(f, v){
  const id = 'f-' + f.k; let inp;
  if (f.t === 'select') inp = `<select id="${id}" name="${f.k}">${f.opts.map(([val,l]) => `<option value="${val}" ${val===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  else inp = `<input id="${id}" name="${f.k}" type="${f.t}" value="${esc(v)}" ${f.t==='number'?'step="0.01" min="0" inputmode="decimal"':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''} autocomplete="off">`;
  return `<div class="fld ${f.full?'full':''}" ${f.show?`data-show='${JSON.stringify(f.show)}'`:''}><label for="${id}">${esc(f.l)}${f.req?' *':''}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
}
function openForm(store, id, preset={}){
  const sc = SCHEMA[store], rec = id ? data[store].find(r => r.id === id) : null;
  const def = f => rec ? (rec[f.k] ?? '') : preset[f.k] ?? (f.def ?? '');
  showModal(`<form id="frm" novalidate><h2>${rec?'Edit':'Add'} ${sc.label.toLowerCase()}</h2>
    <div class="fgrid">${sc.fields.map(f => fieldHTML(f, def(f))).join('')}${store==='bills'?'<div class="preview" id="pv"></div>':''}</div>
    <div class="mact">${rec?`<button type="button" class="btn danger" style="margin-right:auto" data-act="del" data-store="${store}" data-id="${rec.id}">Delete</button>`:''}
    <button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Save</button></div></form>`);
  const form = $('#frm');
  const sync = () => {
    form.querySelectorAll('[data-show]').forEach(el => {
      const cond = JSON.parse(el.dataset.show);
      el.style.display = Object.entries(cond).every(([k, vals]) => vals.includes(form.elements[k].value)) ? '' : 'none';
    });
    if (store === 'bills'){
      const v = k => form.elements[k]?.value;
      // auto-fill amount from price/months
      let txt = '';
      if (v('kind') === 'installment'){
        const n = num(v('months')), a = num(v('amount'));
        if (v('start') && n) txt = `Payments run ${ymLabel(v('start'))} → ${ymLabel(ymAdd(v('start'), n-1))}` + (a ? ` · total ${money(a*(n-1) + (num(v('final'))||a))}` : '');
        else txt = 'Tip: enter the total price and number of months and the amount per payment fills in.';
      } else if (v('kind') === 'monthly') txt = `Shows up every month on the ${v('cutoff')} cutoff` + (v('start') ? ' from ' + ymLabel(v('start')) : '') + (v('end') ? ' until ' + ymLabel(v('end')) : '') + '.';
      else txt = v('month') ? `Only in ${ymLabel(v('month'))}.` : 'Pick the month it applies to.';
      $('#pv').textContent = txt;
    }
  };
  form.addEventListener('input', e => {
    if (store === 'bills' && (e.target.name === 'price' || e.target.name === 'months')){
      const p = num(form.elements.price.value), n = num(form.elements.months.value);
      if (p && n && !form.elements.amount.dataset.touched) form.elements.amount.value = Math.round(p / n * 100) / 100;
    }
    if (e.target.name === 'amount') e.target.dataset.touched = '1';
    sync();
  });
  form.addEventListener('change', sync);
  sync();
  const first = form.querySelector('input'); if (first) first.focus();
  form.addEventListener('submit', e => {
    e.preventDefault();
    const visible = f => { const el = form.elements[f.k].closest('.fld'); return el.style.display !== 'none'; };
    for (const f of sc.fields) if (f.req && !String(form.elements[f.k].value).trim()){ toast(`Please fill in “${f.l}”`); form.elements[f.k].focus(); return; }
    const kind = form.elements.kind?.value;
    if (store === 'bills' && kind === 'installment' && (!form.elements.start.value || !num(form.elements.months.value))){ toast('Installments need a first payment month and number of months'); return; }
    if (store === 'bills' && kind === 'once' && !form.elements.month.value){ toast('Pick the month for this one-time expense'); return; }
    if (store === 'incomes' && form.elements.recur.value === 'once' && !form.elements.month.value){ toast('Pick the month for this one-time income'); return; }
    const obj = rec ? {...rec} : {id: uid()};
    for (const f of sc.fields){
      const val = form.elements[f.k].value;
      obj[f.k] = !visible(f) ? '' : f.t === 'number' ? (val === '' ? '' : num(val)) : String(val).trim();
    }
    if (rec){ const i = data[store].findIndex(r => r.id === rec.id); data[store][i] = obj; } else data[store].push(obj);
    persist(); closeModal(); render(); toast(`${sc.label} ${rec?'updated':'added'}`);
  });
}
function confirmDel(store, id){
  const rec = data[store].find(r => r.id === id); if (!rec) return;
  showModal(`<h2>Delete ${SCHEMA[store].label.toLowerCase()}?</h2><p>“${esc(rec.name)}” will be removed from every month.</p>
    <p class="note">Tip: if it just ended, edit it and set an end month instead, so past months stay accurate.</p>
    <div class="mact"><button class="btn" data-act="close">Cancel</button><button class="btn primary" style="background:var(--bad);border-color:var(--bad)" data-act="confirmdel" data-store="${store}" data-id="${id}">Delete</button></div>`);
}

/* ---------- backup ---------- */
let toastT;
function toast(m, icon){ const t = $('#toast'); t.innerHTML = (icon ? ic(icon) + ' ' : '') + esc(m); t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
function download(text, name, type){ const u = URL.createObjectURL(new Blob([text], {type})); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1500); }
function exportBackup(){ download(JSON.stringify({app:'cio-budget', version:1, exported:new Date().toISOString(), data}, null, 1), `cio-budget-backup-${new Date().toISOString().slice(0,10)}.json`, 'application/json'); toast('Backup downloaded'); }
async function importFile(file){
  let j; try { j = JSON.parse(await file.text()); } catch(e){ toast('That is not a valid backup file'); return; }
  if (!j || j.app !== 'cio-budget' || !j.data){ toast('That is not a budget backup file'); return; }
  const n = (j.data.incomes||[]).length + (j.data.bills||[]).length + (j.data.allocs||[]).length;
  showModal(`<h2>Import this file?</h2><p>It has ${n} items (income, expenses and buckets). This replaces what's currently in your planner.</p>
    <div class="mact"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="do-imp">Replace &amp; import</button></div>`);
  $('#do-imp').onclick = () => {
    data = Object.assign({incomes:[], bills:[], allocs:[], paid:{}, settings:{currency:'₱'}}, j.data);
    data.settings ||= {}; if (!data.settings.trackFrom) data.settings.trackFrom = ymNow(); fixStarterSchedule(); CUR = data.settings.currency || '₱'; persist(); closeModal(); render(); toast('Imported');
  };
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const sg = e.target.closest('[data-seg]');
  if (sg){ qa[sg.dataset.seg] = sg.dataset.val; sg.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === sg));
    const m = document.querySelector('.q-months'); if (m) m.hidden = qa.kind !== 'installment';
    const a = document.querySelector('.q-amt'); if (a) a.placeholder = qa.kind === 'installment' ? 'per month' : '0';
    qaImpact(); return; }
  const ed = e.target.closest('[data-edit]');
  if (ed && !ed.querySelector('input')){ startInlineEdit(ed); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const {act, store, id, v} = b.dataset;
  if (act === 'view') go({view:v});
  else if (act === 'dashhome') go({view:'dash', year:Number(ymNow().slice(0,4))});
  else if (act === 'ym') go({ym:v});
  else if (act === 'year') go({year:Number(v)});
  else if (act === 'goto') go({view:'month', ym:v});
  else if (act === 'home') go({view:'month', ym:ymNow()});
  else if (act === 'back'){ if (navDepth > 0) history.back(); else go({view:'month', ym:ymNow()}); }
  else if (act === 'add'){
    const preset = {};
    if (b.dataset.cut) preset.cutoff = b.dataset.cut;
    if (store === 'bills'){ const ym = b.dataset.ym || ymNow(); preset.start = ym; preset.month = ym; }
    openForm(store, null, preset);
  }
  else if (act === 'edit') openForm(store, id);
  else if (act === 'del') confirmDel(store, id);
  else if (act === 'confirmdel'){
    const name = SCHEMA[store].label;
    data[store] = data[store].filter(r => r.id !== id);
    Object.keys(data.paid).forEach(k => { if (k.startsWith(id + '|')) delete data.paid[k]; });
    persist(); closeModal(); render(); toast(`${name} deleted`);
  }
  else if (act === 'close') closeModal();
  else if (act === 'export') exportBackup();
  else if (act === 'import') $('#import-file').click();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.paid){
    const [bid, ym] = el.dataset.paid.split('|');
    data.paid[el.dataset.paid] = el.checked;
    persist(); render();
    if (el.checked){
      const b = data.bills.find(x => x.id === bid), r = b && billFor(b, ym);
      const C = cutoff(ym, b.cutoff);
      if (C.bills.length && C.paidN === C.bills.length){ celebrate(); toast(`${b.cutoff} cutoff fully paid for ${ymLabel(ym, true)}!`, 'party-popper'); }
      else if (r && r.k && r.k === r.n){ celebrate(); toast(`${b.name} is fully paid off!`, 'party-popper'); }
      else toast(`${b.name} paid · ${C.bills.length - C.paidN} left this cutoff`, 'circle-check');
    }
  }
  else if (el.id === 'ysel') go({year:Number(el.value)});
  else if (el.id === 'bf'){ ui.billFilter = el.value; render(); }
  else if (el.id === 'bc'){ ui.billCut = el.value; render(); }
  else if (el.id === 'cur'){ CUR = data.settings.currency = el.value; persist(); render(); }
  else if (el.id === 'import-file' && el.files[0]){ importFile(el.files[0]); el.value = ''; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

fxInit(); load(); readRoute(); try { history.replaceState(null, '', '#' + routeOf()); } catch(e){} render();
</script>
</body>
</html>
